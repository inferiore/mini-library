# Auto-loaded by `docker compose up` locally (alongside docker-compose.yml).
# Do NOT use this file in production — see docker-compose.prod.yml instead.
#
# Switches app/queue to the `dev` build target and bind-mounts the working
# tree so PHP/Blade/Inertia source changes are visible with neither a rebuild
# nor a container recreation. Adds a `vite` service for frontend HMR.

services:
    app:
        build:
            target: dev
        volumes:
            - .:/var/www/html

    queue:
        build:
            target: dev
        volumes:
            - .:/var/www/html
        # Auto-reloads on job class changes, unlike `queue:work` (prod).
        command: ['php', 'artisan', 'queue:listen', '--tries=3']

    vite:
        # Reuses the `dev` build target (same PHP+Node image as app/queue), not a
        # bare node: image — Wayfinder's Vite plugin shells out to
        # `php artisan wayfinder:generate` at dev-server startup too, so `vite`
        # needs PHP available for exactly the same reason the production `build`
        # stage does (see Dockerfile).
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        working_dir: /var/www/html
        # `npm install` (not `ci`) runs on every start since this is dev-only and
        # the node_modules volume below is anonymous/ephemeral per container.
        command: sh -c "npm install && npm run dev"
        environment:
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            - .:/var/www/html
            # Anonymous volume shadows the bind-mounted node_modules so the
            # container gets its own Linux-compiled native deps (esbuild/rollup)
            # instead of whatever the host platform installed.
            - /var/www/html/node_modules
        ports:
            - '5173:5173'
