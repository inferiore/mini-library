name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Pint (formatting check)
        run: composer lint:check

      - name: PHPStan
        run: composer types:check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint/format check
        run: npm run check

      - name: TypeScript check
        run: npm run types:check

      - name: Build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U library -d library"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, opcache, pcntl
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run fast test suite (SQLite)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Migrate against Postgres+pgvector
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: library
          DB_USERNAME: library
          DB_PASSWORD: library

      - name: Run test suite against Postgres+pgvector
        run: php artisan test -c phpunit.ci.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: library
          DB_USERNAME: library
          DB_PASSWORD: library

  docker-build:
    runs-on: ubuntu-latest
    needs: [static-analysis, frontend, backend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build-only: no registry is configured yet (see docker-compose.prod.yml
      # and spec 010), so this validates that the production image builds
      # cleanly and doesn't push anywhere.
      - name: Build production image
        run: docker build --target production -t mini-library:ci .

  # Re-scoped into spec 010 on 2026-09-08 (see docs/specs/010-deployment.md's
  # "Re-scoping note") — the spec as originally written deferred this job to a
  # follow-up spec, but a real deploy target now exists.
  #
  # Deliberately does NOT check the repo out or build anything here: the
  # actual build happens *on the target host* (see the `script:` below), from
  # the same Dockerfile CI just proved builds cleanly in `docker-build`. There
  # is still no image registry, so "deploy" means "the host rebuilds the
  # production image itself from the git commit it just pulled" — see
  # DEPLOYMENT.md's rollback section for why that shapes the rollback story
  # too (no registry to just re-point at a prior tag).
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [static-analysis, frontend, backend-tests, docker-build]
    # Belt-and-suspenders scoping to "real push to this repo's main branch
    # only": checking github.ref alone isn't enough on a workflow that also
    # runs on pull_request (a PR's own ref never equals refs/heads/main, but
    # relying on ref alone is a known footgun elsewhere, so event_name is
    # checked explicitly too rather than trusted implicitly).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serializes deploys so two merges landing close together can't race each
    # other's `git pull` / `docker compose up -d --build` on the same host
    # directory (same class of concurrent-writer problem docker-entrypoint.sh
    # already avoids for migrations, one level up the stack).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # appleboy/ssh-action, pinned to v1.2.5's release commit. Chosen over
      # webfactory/ssh-agent because the whole deploy is a single remote
      # script (no local build/checkout needed in this job — see comment
      # above), which is exactly what this action is for; webfactory/ssh-agent
      # instead just loads a key into a local ssh-agent for *other* steps to
      # use, which this job doesn't need.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Forwarded into the remote script via `envs:` below rather than
          # interpolated directly into the `script:` string, so the path
          # value is never spliced into shell text GitHub Actions has to
          # re-parse — it just arrives as a normal env var over the SSH
          # session, same as SSH_HOST/SSH_USER/DEPLOY_SSH_KEY never appear in
          # this file as anything but a `secrets.*` reference.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e

            # $DEPLOY_PATH is expected to already be a clean checkout of this
            # repo on the target host, with its own production `.env` already
            # in place (never copied over SSH by this job — see
            # DEPLOYMENT.md's "secrets live on the host" note). --ff-only
            # deliberately refuses to deploy if the host directory has local
            # commits/changes CI doesn't know about, rather than silently
            # discarding them.
            cd "$DEPLOY_PATH"
            git fetch origin main
            git merge --ff-only origin/main

            # No registry: this rebuilds the production image locally on the
            # host from the commit just pulled. docker-entrypoint.sh handles
            # config:cache + migrate --force at container start, same as
            # local dev and the manual runbook in DEPLOYMENT.md — this job
            # intentionally does nothing migration-related itself.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Fails the job (and, per this Action, the whole workflow run)
            # rather than reporting a false success if the app doesn't come
            # back up healthy — `set -e` above means a non-zero exit from
            # this loop stops the script here, mid-script, with everything
            # already logged. There's no automatic rollback on this failure
            # (see DEPLOYMENT.md's "Not Yet Implemented" section) — a failed
            # health check here means manual intervention, not a silent
            # revert.
            attempt=0
            until docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web wget -q -O- http://localhost/up > /dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 10 ]; then
                echo "Deploy health check failed: GET /up did not succeed after ${attempt} attempts" >&2
                exit 1
              fi
              sleep 3
            done
            echo "Deploy health check passed."
