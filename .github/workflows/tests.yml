name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Pint (formatting check)
        run: composer lint:check

      - name: PHPStan
        run: composer types:check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Install dependencies
        run: npm ci

      - name: Lint/format check
        run: npm run check

      - name: TypeScript check
        run: npm run types:check

      # `npm run build` shells out to `php artisan wayfinder:generate` (the
      # @laravel/vite-plugin-wayfinder plugin) to emit typed route/action
      # helpers before bundling — needs vendor/autoload.php and a booted
      # Laravel app (hence the PHP setup + composer install + .env above),
      # even though this job otherwise never touches PHP application code.
      - name: Build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U library -d library"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, opcache, pcntl
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrate against Postgres+pgvector
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: library
          DB_USERNAME: library
          DB_PASSWORD: library

  docker-build:
    runs-on: ubuntu-latest
    needs: [static-analysis, frontend, backend-tests]
    # Needed only for the push step below (on main); the build-validation
    # step itself needs no elevated permissions and still runs on PRs too,
    # where `packages: write` is granted but simply unused (the push step's
    # own `if:` keeps PRs from ever attempting to push).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates the production image builds cleanly on every PR/push —
      # kept separate from the registry tag below so a PR build never
      # produces or depends on a pushed image.
      - name: Build production image
        run: docker build --target production -t mini-library:ci .

      # Pushed only on main, not PRs: this is what the `deploy` job later
      # pulls (see the `deploy` job below) instead of rebuilding from source
      # on the target host — rebuilding PHP from source there was timing out
      # (opcache/JIT compilation alone runs several minutes on a small VM).
      # Tagged with both `latest` (what the host pulls) and the commit SHA
      # (an addressable, previously-built artifact to roll back to — see
      # DEPLOYMENT.md's Rollback section, no longer "rebuild the previous
      # commit" now that a registry exists).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker tag mini-library:ci "$image:latest"
          docker tag mini-library:ci "$image:${{ github.sha }}"
          docker push "$image:latest"
          docker push "$image:${{ github.sha }}"

  # Re-scoped into spec 010 on 2026-09-08 (see docs/specs/010-deployment.md's
  # "Re-scoping note") — the spec as originally written deferred this job to a
  # follow-up spec, but a real deploy target now exists.
  #
  # Deliberately does NOT check the repo out or build anything here: the
  # image was already built and pushed to GHCR by `docker-build` above — this
  # job only pulls it and restarts containers on the target host. Rebuilding
  # PHP from source on the host itself (the original approach) was timing
  # out there; building once on GitHub's runners and shipping a finished
  # artifact avoids that entirely, and also means rollback is now "pull a
  # previous tag" rather than "rebuild an old commit" (see DEPLOYMENT.md's
  # Rollback section).
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [static-analysis, frontend, backend-tests, docker-build]
    # Each job gets its own freshly-scoped GITHUB_TOKEN based on its own
    # `permissions:` block — docker-build's `packages: write` does NOT carry
    # over here. `packages: read` is the minimum this job needs to `docker
    # login`/pull the image docker-build just pushed.
    permissions:
      contents: read
      packages: read
    # Belt-and-suspenders scoping to "real push to this repo's main branch
    # only": checking github.ref alone isn't enough on a workflow that also
    # runs on pull_request (a PR's own ref never equals refs/heads/main, but
    # relying on ref alone is a known footgun elsewhere, so event_name is
    # checked explicitly too rather than trusted implicitly).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serializes deploys so two merges landing close together can't race each
    # other's `git pull` / `docker compose pull`/`up` on the same host
    # directory (same class of concurrent-writer problem docker-entrypoint.sh
    # already avoids for migrations, one level up the stack).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # appleboy/ssh-action, pinned to v1.2.5's release commit. Chosen over
      # webfactory/ssh-agent because the whole deploy is a single remote
      # script (no local build/checkout needed in this job — see comment
      # above), which is exactly what this action is for; webfactory/ssh-agent
      # instead just loads a key into a local ssh-agent for *other* steps to
      # use, which this job doesn't need.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Forwarded into the remote script via `envs:` below rather than
          # interpolated directly into the `script:` string, so the values
          # are never spliced into shell text GitHub Actions has to
          # re-parse — they just arrive as normal env vars over the SSH
          # session, same as SSH_HOST/SSH_USER/DEPLOY_SSH_KEY never appear in
          # this file as anything but a `secrets.*` reference. GITHUB_TOKEN
          # is the workflow's own short-lived token (no new secret needed) —
          # it has `packages: write` on this job (see `docker-build` above)
          # and is valid to both push and pull for the duration of this run
          # only, so `docker login` on the host is re-established fresh
          # every deploy rather than relying on a long-lived credential
          # sitting on disk there.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            # $DEPLOY_PATH is expected to already be a clean checkout of this
            # repo on the target host, with its own production `.env` already
            # in place (never copied over SSH by this job — see
            # DEPLOYMENT.md's "secrets live on the host" note). --ff-only
            # deliberately refuses to deploy if the host directory has local
            # commits/changes CI doesn't know about, rather than silently
            # discarding them. Still needed even in the pull-based flow: this
            # is what keeps docker-compose.yml/docker-compose.prod.yml
            # themselves in sync on the host, and is what `git log`/rollback
            # commands below operate against.
            cd "$DEPLOY_PATH"
            git fetch origin main
            git merge --ff-only origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Reclaim disk from any images/layers superseded by the pull
            # below — cheap insurance against the disk slowly filling across
            # many deploys (each pulled image differs from the last only in
            # its top layers, but old ones aren't automatically removed).
            # Neither command touches running containers or named volumes.
            docker image prune -af

            # --no-deps app web queue: production uses an external managed
            # Postgres+pgvector (Supabase), not the bundled `postgres`
            # service — without --no-deps, Compose would still create/start
            # the local postgres container anyway, solely because app/queue
            # declare `depends_on: postgres` in the base compose file. The
            # host's own .env points DB_* at Supabase instead.
            #
            # docker-entrypoint.sh handles config:cache + migrate --force at
            # container start, same as local dev and the manual runbook in
            # DEPLOYMENT.md — this job intentionally does nothing
            # migration-related itself.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app queue
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps app web queue

            # Fails the job (and, per this Action, the whole workflow run)
            # rather than reporting a false success if the app doesn't come
            # back up healthy — `set -e` above means a non-zero exit from
            # this loop stops the script here, mid-script, with everything
            # already logged. There's no automatic rollback on this failure
            # (see DEPLOYMENT.md's "Not Yet Implemented" section) — a failed
            # health check here means manual intervention, not a silent
            # revert.
            #
            # 127.0.0.1, not localhost: the web container's /etc/hosts maps
            # `localhost` to both 127.0.0.1 and ::1, and wget tries the IPv6
            # entry first — nginx here only listens on 0.0.0.0:80 (the
            # official image's IPv6-listen entrypoint script can't modify
            # our mounted-read-only default.conf), so `localhost` resolved
            # "Connection refused" every single attempt even though the app
            # was actually healthy and responding correctly on IPv4.
            # Confirmed by reproducing both directly against a live deploy.
            attempt=0
            until docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web wget -q -O- http://127.0.0.1/up > /dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 10 ]; then
                echo "Deploy health check failed: GET /up did not succeed after ${attempt} attempts" >&2
                exit 1
              fi
              sleep 3
            done
            echo "Deploy health check passed."
