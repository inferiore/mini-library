# Layer on top of docker-compose.yml for a production-shaped deploy:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       pull app queue
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       up -d --no-deps app web queue
#
# Not auto-loaded — docker-compose.override.yml is what `docker compose up`
# picks up by default locally, so this file is inert unless named explicitly.
#
# Production uses an external managed Postgres+pgvector (Supabase) rather
# than the bundled `postgres` service, which exists only for local dev/CI —
# hence naming `app web queue` explicitly with `--no-deps` above: without
# `--no-deps`, Compose would still create/start the local `postgres`
# container too, purely because `app`/`queue` declare `depends_on: postgres`
# in the base file. `DB_*` in the host's own `.env` points at Supabase
# instead (see DEPLOYMENT.md).
#
# `app`/`queue` are pulled from GHCR rather than built here: rebuilding PHP
# from source (opcache/JIT compilation) was timing out on the target host's
# hardware. The `docker-build` CI job builds and pushes this same image on
# every push to main (see .github/workflows/tests.yml) — the host only ever
# pulls a previously-validated artifact, never compiles anything itself.
# `IMAGE_TAG` defaults to `latest` but can be overridden (e.g.
# `IMAGE_TAG=<previous-sha> docker compose ... up -d --no-deps app queue`)
# to roll back to a specific previous build without rebuilding it — see
# DEPLOYMENT.md's Rollback section.

services:
    app:
        image: ghcr.io/inferiore/mini-library:${IMAGE_TAG:-latest}
        restart: unless-stopped

    web:
        restart: unless-stopped

    queue:
        image: ghcr.io/inferiore/mini-library:${IMAGE_TAG:-latest}
        restart: unless-stopped
