# Base, production-shaped Compose definition. Locally, docker-compose.override.yml
# is auto-loaded on top of this (bind mounts, `dev` build target, HMR). In
# production, layer docker-compose.prod.yml instead:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# `.env` values are read at container START by docker-entrypoint.sh
# (`config:cache` + `migrate --force`), never baked in at build time — so an
# `.env` edit only ever needs `docker compose up -d --force-recreate`, never a
# rebuild. See Dockerfile / docker-entrypoint.sh for the mechanics.
#
# `app`/`queue` deliberately have neither `build:` nor `image:` here — each
# overlay supplies exactly one: docker-compose.override.yml adds `build:`
# (dev target, for local HMR/bind mounts), docker-compose.prod.yml adds
# `image:` (pulled from GHCR, never built on the deploy host). Compose merges
# `build:`/`image:` together rather than letting one overlay replace the
# other, so this base file must define neither for the prod pull-based flow
# to actually pull instead of building.

services:
    app:
        env_file:
            - .env
        volumes:
            - app-public:/var/www/html/public-shared
        depends_on:
            postgres:
                condition: service_healthy

    web:
        image: nginx:alpine
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - app-public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${DB_DATABASE:-library}
            POSTGRES_USER: ${DB_USERNAME:-library}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-library} -d ${DB_DATABASE:-library}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    queue:
        env_file:
            - .env
        command: ['php', 'artisan', 'queue:work', '--tries=3']
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    pgdata:
    app-public:
