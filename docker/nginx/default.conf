server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # 127.0.0.11 is Docker's embedded DNS server (always available on a
    # custom bridge network, which Compose creates by default). A plain
    # `fastcgi_pass app:9000;` resolves the `app` hostname exactly once, at
    # nginx worker startup, and caches that IP indefinitely — when `app` is
    # later recreated (any deploy, crash-restart, or `docker compose up`
    # that doesn't also recreate `web`), nginx keeps sending FastCGI
    # requests to the old container's now-dead IP, producing a persistent
    # 502 Bad Gateway until nginx itself is restarted. Confirmed happening
    # in a real deploy. Passing a variable to fastcgi_pass instead of a bare
    # hostname forces nginx to re-resolve through this resolver (respecting
    # its `valid=` TTL) on each request rather than caching at startup.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny dotfiles except .well-known (ACME challenges, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
